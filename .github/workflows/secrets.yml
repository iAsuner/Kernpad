name: Source security checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python Source/Tests/RepositoryTests.py
      - run: python Source/check-repository.py
      - name: Install checksum-pinned official Gitleaks
        shell: python
        run: |
          import hashlib, io, os, pathlib, tarfile, urllib.request
          url = 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          data = urllib.request.urlopen(url, timeout=60).read()
          expected = '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Gitleaks checksum mismatch')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              member = archive.getmember('gitleaks')
              if not member.isfile():
                  raise SystemExit('Unexpected archive member')
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gitleaks'
              target.write_bytes(archive.extractfile(member).read())
              target.chmod(0o700)
      - name: Scan only intended source with redacted output
        run: python Source/scan-secrets.py --gitleaks "$RUNNER_TEMP/gitleaks"
