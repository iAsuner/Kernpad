function validateRelations(preview){
 const emails=new Map(records.filter(r=>r.type==='email'&&!r._sealed).map(r=>[accountOf(r),{password:secretOf(r),seed:r.otpSecret||''}]));
 for(const row of preview.rows){if(row.error)continue;const d=row.data,address=d['email.account']||'',password=d['email.password']||'',seed=d['email.totp']||'';
  if(!address&&(password||seed)){row.error='存在邮箱凭据，但 email.account 为空';continue;}
  if(!address)continue;const old=emails.get(address);
  if(old&&((password&&old.password!==password)||(seed&&old.seed!==seed))){row.error='关联邮箱凭据与已有记录或本批次不一致；未覆盖，请先核对';continue;}
  if(!old)emails.set(address,{password,seed});
 }
 return preview;
}

function base32Decode(value){let buffer=0,bits=0;const out=[];for(const c of value.toUpperCase().replace(/[\s=]/g,'')){const n='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'.indexOf(c);if(n<0)throw new Error('密钥不是 Base32');buffer=(buffer<<5)|n;bits+=5;if(bits>=8){bits-=8;out.push((buffer>>bits)&255);buffer&=(1<<bits)-1;}}if(bits&&buffer)throw new Error('Base32 尾部不完整');return new Uint8Array(out);}

 if(r.type==='note'&&!r.fields.length)$('.mj-doc-section')?.remove();
 if(!isProtected(r))$('[data-v4="paste-entry"]')?.remove();
 if(!isProtected(r)&&!r.refs.length&&!linksOf(r).length&&!records.some(other=>other.refs.includes(r.id))){$('.mj-inspector')?.remove();$('.mj-docbody').style.gridTemplateColumns='1fr';}
 $('.mj-document-kind').insertAdjacentHTML('beforeend',`<span class="mj-protection-chip">${icon(isProtected(r)?'lock-keyhole':'sticky-note')}${isProtected(r)?'密码库保护':'免解锁便签'}</span>`);
 $('.mj-toolbar [data-v5="templates"]')?.remove();const newButton=$('.mj-toolbar [data-action="new"]');
 newButton.insertAdjacentHTML('beforebegin',`<button class="mj-button mj-template-switch cursor-interaction" data-v5="templates">${icon('layout-template')}<span>${escape(r.type==='note'&&isProtected(r)?'加锁便签':types[r.type].name)}</span>${icon('chevron-down')}</button>`);
}
function renderTable(){if(state.area==='vault'){renderVaultTable();return;}const notes=filtered();$('#mj-workspace').innerHTML=`<div class="mj-page"><div class="mj-pagehead"><div><h1>${groupName()}</h1><small>${notes.length} 条便签，无需解锁即可记录</small></div></div><div class="mj-note-grid">${notes.map(r=>`<button class="mj-note-card cursor-interaction" data-open="${r.id}"><span>${icon('file-text')}${r.favorite?icon('star'):''}</span><strong>${escape(r.name)}</strong><p>${escape(r.summary||r.blocks.find(b=>b.text)?.text||'空白便签')}</p><small>${escape(r.tag||'便签')}</small></button>`).join('')}</div></div>`;}
function renderVaultGate(){root.classList.remove('mj-in-document','mj-document-edit');root.classList.add('mj-document-view');$('.mj-toolbar [data-v5="templates"]')?.remove();$('#mj-breadcrumb').textContent='密码库';$('#mj-workspace').innerHTML=`<div class="mj-vault-gate"><div class="mj-gate-icon">${icon('lock-keyhole')}</div><h1>密码库已锁定</h1><p>账号、密码、验证码和关联资料<br>解锁后在这里查看。</p><button class="mj-primary cursor-interaction" data-v5="unlock">${icon('fingerprint')}解锁密码库</button><small>普通便签仍可直接使用</small></div>`;}
function changeArea(area){if(state.area==='vault'&&area!=='vault')clearRecordCaches();state.selected=null;state.area=area;state.category='all';state.platformFilter='all';state.page=0;state.search='';state.view='table';state.history=[];$('#mj-search').value='';pasteEditor=null;docMode='view';render();}
function openRecord(id){
 const r=record(id);if(!r)return;
 if(isProtected(r)&&!vaultUnlocked){requestVaultUnlock(()=>openRecord(id));return;}
 state.area=isProtected(r)?'vault':'notes';if(state.view==='document'&&state.selected!==id)state.history.push(state.selected);
 state.selected=id;state.view='document';docMode=id.startsWith('new-')?'edit':'view';pasteEditor=null;richSelection=null;activeRichIndex=null;insertContext=null;closeModal();render();remember();
}
function createPlainNote(){const r=schemaRecord(getTemplate('note'),{},{name:'未命名便签'});r.protected=false;r.tag='便签';records.unshift(r);openRecord(r.id);docMode='edit';render();remember();requestAnimationFrame(()=>$('.mj-doc-title')?.focus());}
function showNew(id){if(id==='note'){createPlainNote();return;}const create=()=>{const r=schemaRecord(getTemplate(id),{},{name:'未命名'+getTemplate(id).name});r.protected=true;records.unshift(r);closeModal();openRecord(r.id);};requestVaultUnlock(create);}
function switchTemplate(id){
 const r=selected(),t=getTemplate(id);if(!t)return;
 const apply=()=>{
  if(!r||selected()!==r||r._sealed)return;
  snapshotEditor();const oldFields=r.fields,existing=new Map(oldFields.filter(d=>d.key).map(d=>[d.key,d.value]));
  const converted=schemaRecord(t,Object.fromEntries(existing),{name:r.name,summary:r.summary,refs:r.refs,lightweight:true});
  for(const field of oldFields)if(!converted.fields.some(d=>d.key&&d.key===field.key||d.label===field.label))converted.fields.push({...field});
  r.type=converted.type;r.fields=converted.fields;r.protected=templateArea(t)==='vault'||r.protected===true;r.verification=converted.verification;
  if(t.documentTemplate){
   if(r.templateID!==id){for(const item of (r.blocks||[]).flatMap(b=>[b,...b.fields||[]]))delete item.templateComponentID;const blocks=converted.blocks;if(blocks[0])blocks[0].layout={...blocks[0].layout,breakBefore:true};r.blocks=[...r.blocks||[],...blocks];}
   r.templateID=id;
  }else delete r.templateID;
  applyTemplateListRoles(r,t);ensureComponentIDs(r);
  syncRecordMetadata(r);state.area=isProtected(r)?'vault':'notes';state.category='all';docMode='edit';closeModal();render();remember();toast(t.documentTemplate?ui('已应用模板，新组件追加在正文后；原有资料保留。','Template applied. New components were appended; existing content is preserved.'):'已切换模板，原有正文、字段和关联保留');
 };
 if(templateArea(t)==='vault'||isProtected(r))requestVaultUnlock(apply);else apply();
}
function showRecordTemplates(){const r=selected();modal('切换当前记录的模板','正文与已有资料会保留；密码类模板使用密码库保护。',`<div class="mj-templates">${allTemplates().map(t=>`<button class="mj-template cursor-interaction ${r.type===t.id?'mj-selected-template':''}" data-v5="choose-template" data-id="${escape(t.id)}">${icon(t.id==='note'?'sticky-note':types[t.id].icon)}<strong>${escape(t.name)}</strong><small>${t.id==='note'?'随手记、文档与待办':`${t.fields.filter(d=>!d.key.startsWith('email.')).length} 个字段，内容由密码库保护`}</small></button>`).join('')}</div>${isProtected(r)?'<p class="mj-parser-hint">已受保护的记录切换为便签模板后，仍保留密码库保护。</p>':''}`,`<button class="mj-button cursor-interaction" data-v5="protected-note">${icon('lock-keyhole')}设为加锁便签</button>`);$('#mj-overlay .mj-modal').classList.add('mj-wide-modal');}
function requestVaultUnlock(action){if(vaultUnlocked){action?.();return;}pendingPrivateAction=action||null;showAuthDemo();}
function showAuthDemo(recovery=false){state.modal='vault-auth';modal(recovery?'恢复密码库，演示':'解锁密码库',security.platform==='mac'?'正式版使用 Touch ID 或 Mac 系统密码。':'正式版使用 Windows Hello 指纹、面容或 PIN。',`<div class="mj-lock-emblem">${icon(recovery?'key-round':'fingerprint')}</div><p class="mj-parser-hint">这是验证流程演示，不会请求或读取真实系统密码。普通便签不需要此验证。</p>`,`<button class="mj-button cursor-interaction" data-v5="cancel-unlock">取消</button><button class="mj-primary cursor-interaction" data-v2="confirm-demo-unlock">模拟验证成功</button>`);$('#mj-overlay [data-action="close-modal"]').dataset.v5='cancel-unlock';}
function unlockDemo(){vaultUnlocked=true;state.locked=false;lastActivity=unlockedAt=Date.now();security.showFull=true;otpStep=-1;const pending=pendingPrivateAction;pendingPrivateAction=null;closeModal();if(pending)pending();else changeArea('vault');render();toast('密码库已解锁，演示');}
function lock(reason='已手动锁定密码库'){
 vaultUnlocked=false;state.locked=false;pendingPrivateAction=null;otpValues.clear();blockCodes.clear();blockCodeStamp='';otpStep=-1;richSelection=null;insertContext=null;closeComponentMenu();
 if(state.area==='vault'){pasteEditor=null;builder=null;entryDraft=null;entryPreview=null;editorUndo=null;docMode='view';closeModal();}
 render();$('#mj-status-text').textContent=typeof reason==='string'?reason:'密码库已锁定';
}
function checkLock(){const clock=$('#mj-lock-clock');if(!vaultUnlocked){clock.textContent='密码库已锁定';return;}const now=Date.now();if(security.maximum&&now-unlockedAt>=security.maximum*1000){lock('密码库达到最长解锁时长');return;}if(now-lastActivity>=security.idle*1000){lock('密码库无操作，已自动锁定');return;}const seconds=Math.ceil(Math.min(security.idle-(now-lastActivity)/1000,security.maximum?security.maximum-(now-unlockedAt)/1000:Infinity));clock.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')} 后锁定密码库`;}
function updateActivity(){if(vaultUnlocked&&state.area==='vault')lastActivity=Date.now();}
async function tick(){root.style.setProperty('--otp-progress',((30-Math.floor(Date.now()/1000)%30)/30*360)+'deg');await tickV4();if(typeof refreshListPreviews==='function')refreshListPreviews();}
function lockedReference(r){return `<button class="mj-related cursor-interaction" data-open="${r.id}"><span class="mj-ref-title">${icon('lock-keyhole')}受保护记录</span><small>解锁密码库后查看</small></button>`;}
function relationInline(r){return isProtected(r)&&!vaultUnlocked?lockedReference(r):relationInlineV3(r);}
function relatedCard(r,back=false){return isProtected(r)&&!vaultUnlocked?lockedReference(r):relatedCardV3(r,back);}
function addBlock(typeId){
 const r=selected(),sensitive=['form','preset-login','preset-server'].includes(typeId);
 if(sensitive&&!isProtected(r)){const context=insertContext;requestVaultUnlock(()=>{r.protected=true;state.area='vault';docMode='edit';insertContext=context;addBlockV4(typeId);render();toast('含凭据的便签已放入密码库');});return;}
 addBlockV4(typeId);
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.action==='new'){e.preventDefault();e.stopImmediatePropagation();if(state.area==='vault'){if(typeof showNewChooser==='function')showNewChooser();else showTemplates();}else createPlainNote();return;}
 if(b.dataset.v3Editor==='save-field'&&!isProtected(selected())&&$('#mj-component-kind')?.value==='secret'){
  const label=$('#mj-component-label').value.trim();if(!label)return;const r=selected(),target=fieldTarget;
  e.preventDefault();e.stopImmediatePropagation();requestVaultUnlock(()=>{r.protected=true;const field={...F('field_'+crypto.randomUUID().replaceAll('-','_'),label,'secret'),value:'',secret:true};if(target===null)r.fields.push(field);else r.blocks[target].fields.push(field);fieldTarget=null;state.area='vault';docMode='edit';closeModal();render();toast('密码字段已加入，便签已放入密码库');});return;
 }
 const action=b.dataset.v5;if(!action)return;e.preventDefault();e.stopImmediatePropagation();
 if(action==='area')changeArea(b.dataset.area);
 if(action==='templates')showRecordTemplates();
 if(action==='choose-template')switchTemplate(b.dataset.id);
 if(action==='protected-note'){const r=selected();requestVaultUnlock(()=>{snapshotEditor();r.type='note';r.protected=true;state.area='vault';docMode='edit';closeModal();render();});}
 if(action==='unlock')requestVaultUnlock();
 if(action==='cancel-unlock'){pendingPrivateAction=null;closeModal();}
},true);
root.addEventListener('scroll',e=>{if(e.target.classList?.contains('mj-docbody'))closeComponentMenu();},true);
const commandAliases={heading1:['h1','一级标题'],heading2:['h2','二级标题'],heading3:['h3','三级标题'],text:['text','p','正文'],code:['code','代码','代码块'],table:['table','表格'],check:['todo','check','待办','清单'],form:['form','表单'],otp:['2fa','totp','otp','验证码','动态码'],date:['date','calendar','日期'],tags:['tag','tags','标签'],link:['link','url','网址','链接'],quote:['quote','引用'],'bullet-list':['list','ul','无序列表'],'number-list':['ol','有序列表'],callout:['tip','callout','提示'],divider:['line','hr','分隔线'],field:['field','字段'],relation:['rel','关联'], 'preset-login':['login','account','账号组合'],'preset-server':['server','服务器组合'],'preset-contact':['contact','联系人组合']};
function matchingCommands(query){const q=query.trim().replace(/^@/,'').toLowerCase();return componentTypes.filter(x=>!q||[...x,...(commandAliases[x[0]]||[])].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number((commandAliases[b[0]]||[]).includes(q))-Number((commandAliases[a[0]]||[]).includes(q)));}
function renderMenuOptions(query){const choices=matchingCommands(query),box=$('.mj-menu-options');if(!box)return;box.innerHTML=choices.map(([id,ico,title,hint],i)=>`<button class="mj-component-option cursor-interaction ${i===0?'mj-menu-active':''}" data-v4="insert" data-type="${id}">${icon(ico)}<span>${title}<small>${hint}</small></span><kbd>@${(commandAliases[id]||[id])[0]}</kbd></button>`).join('')||'<span class="mj-menu-empty">没有匹配的指令或组件</span>';const input=$('#mj-component-search');if(input)input.placeholder='输入 2fa、table、code 或中文…';icons();}

render();checkLock();const interval=setInterval(tick,1000);window.addEventListener('pagehide',()=>clearInterval(interval),{once:true});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--mj-row-pad',appearance.spacing==='紧凑'?'9px':'13px');render();}});tweak.addSelect(appearance,'spacing',{label:'表格密度',options:['舒适','紧凑']});tweak.addToggle(appearance,'relations',{label:'显示关联侧栏'});}
})();
</script>
